name: Otopark verisi guncelle (Rangeo Plus)

on:
  schedule:
    - cron: "17 1 * * 0"   # her pazar 04:17 (Türkiye saati)
  workflow_dispatch: {}    # Actions sekmesinden elle çalıştırma
  push:
    branches: [main]
    paths: ['scripts/otopark-veri.mjs', '.github/workflows/otopark-veri.yml']

permissions:
  contents: write

concurrency:
  group: otopark-veri
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: osmium kur
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: OpenStreetMap Türkiye kopyasını indir (Geofabrik)
        run: curl -fsSL --retry 3 -o turkey.osm.pbf https://download.geofabrik.de/europe/turkey-latest.osm.pbf && ls -lh turkey.osm.pbf
      - name: Otoparkları ayıkla
        run: |
          osmium tags-filter turkey.osm.pbf nwr/amenity=parking -o otopark.osm.pbf --overwrite
          osmium export otopark.osm.pbf -f geojsonseq -o otoparklar.geojsonseq --overwrite
          node scripts/otopark-veri.mjs otoparklar.geojsonseq
          rm -f turkey.osm.pbf otopark.osm.pbf otoparklar.geojsonseq
      - name: Degisiklik varsa kaydet
        run: |
          git config user.name "otopark-veri-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sarjharitasi/otoparklar.json
          if git diff --cached --quiet; then echo "Degisiklik yok"; exit 0; fi
          git commit -m "Otopark verisi guncellendi"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
