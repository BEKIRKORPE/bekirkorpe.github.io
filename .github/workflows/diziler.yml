name: Diziler hazirla (Canli TV)

on:
  schedule:
    - cron: "37 8 * * *"   # her gün 11:37 (Türkiye saati) — YouTube kotası 11:00'de yenilenir
  workflow_dispatch: {}     # Actions sekmesinden elle çalıştırma
  push:
    paths:
      - "canlitv/diziler.json"
      - "scripts/dizi_hazirla.py"
      - "canlitv/filmler.json"
      - "scripts/film_hazirla.py"
      - "scripts/spor_hazirla.py"

permissions:
  contents: write

concurrency:
  group: diziler
  cancel-in-progress: false

jobs:
  hazirla:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kanallari tara, sadece tam bolumu olan dizileri yaz
        run: python3 scripts/dizi_hazirla.py
      - name: Spor - en son mac ozetleri
        if: always()
        continue-on-error: true
        run: python3 scripts/spor_hazirla.py
      - name: Sinema - resmi film kanallarini tara, filmleri yaz
        if: always()
        continue-on-error: true
        run: python3 scripts/film_hazirla.py
      - name: Degisiklik varsa kaydet
        if: always()
        run: |
          git config user.name "diziler-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A canlitv/hazir
          [ -f scripts/dizi_onbellek.json ] && git add scripts/dizi_onbellek.json; [ -f scripts/film_onbellek.json ] && git add scripts/film_onbellek.json; [ -f scripts/spor_onbellek.json ] && git add scripts/spor_onbellek.json; true
          if git diff --cached --quiet; then echo "Degisiklik yok"; exit 0; fi
          git commit -m "Canli TV: diziler listesi guncellendi"
          # Bu arada repoya başka bir değişiklik gelmiş olabilir: çakışmada botun yeni listesi geçerli olsun, 5 kez dene
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null; sleep $((i*5))
          done
          exit 1
