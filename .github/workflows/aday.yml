name: Aday kanal adresleri (Canli TV)
on:
  push:
    paths:
      - "scripts/adaylar.json"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: diziler
  cancel-in-progress: false
jobs:
  dene:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
        continue-on-error: true
      - run: python3 scripts/aday_dene.py
      - name: Kaydet
        run: |
          git config user.name "kanal-bot"; git config user.email "actions@users.noreply.github.com"
          git add scripts/aday_sonuc.json; git diff --cached --quiet && exit 0
          git commit -m "Canli TV: aday adres sonuclari"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && exit 0; git rebase --abort 2>/dev/null; sleep $((i*5)); done; exit 1
