name: Gecici kanal arama (silinecek)
on:
  push:
    paths: [".github/workflows/gecici_ara.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  ara:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ara
        shell: python
        run: |
          import json, urllib.request, urllib.parse
          cfg = json.load(open("canlitv/diziler.json", encoding="utf-8"))
          fl = json.load(open("canlitv/filmler.json", encoding="utf-8"))
          KEY = cfg["apiKey"]
          def get(p, **q):
              q["key"] = KEY
              try:
                  return json.load(urllib.request.urlopen("https://www.googleapis.com/youtube/v3/" + p + "?" + urllib.parse.urlencode(q), timeout=30))
              except Exception as e:
                  print("ERR", p, q.get("q") or q.get("forHandle") or "", getattr(e, "read", lambda: b"")()[:200]); return {}
          def show(items, tag):
              for c in items or []:
                  s = c.get("statistics", {}); sn = c.get("snippet", {})
                  print(f"{tag}\t{c['id']}\t{sn.get('customUrl','')}\t{sn.get('title','')}\tsubs={s.get('subscriberCount','?')}\tvid={s.get('videoCount','?')}\t{sn.get('country','')}")
          def by_ids(ids, tag):
              for i in range(0, len(ids), 50):
                  show(get("channels", part="snippet,statistics", id=",".join(ids[i:i+50])).get("items"), tag)
          ids=["UC9wOm30AfLHPq_Bdq65BPSg","UCb2hduhWqkr4781Z7yx1ZZA","UClzojNX_9GuNDjf_8qZ9y0w","UCCm7h1oHcifE3QZNjLp_hxA","UCQ-aQK4lA3N1qQrwDWRC9qw","UCBaxgHbxxRGhvVxx3bniTqw","UCn8o5QsbffDMPYx1SMTDi-A","UCrNcqd48r31nZWmh4f27L5Q","UCoe0QD045tgbTE6bsbRGU5w"]
          r=get("channels", part="snippet,statistics,contentDetails", id=",".join(ids))
          for c in r.get("items",[]):
              sn=c["snippet"]; print("KANAL",c["id"],sn.get("customUrl"),sn["title"],c["statistics"].get("subscriberCount"),"| ACIKLAMA:",sn.get("description","").replace("\n"," ")[:400])
              up=c["contentDetails"]["relatedPlaylists"]["uploads"]
              v=get("playlistItems", part="snippet", playlistId=up, maxResults=6)
              for x in v.get("items",[]): print("  VID",x["snippet"]["publishedAt"][:10],x["snippet"]["title"][:90])
