name: Gecici kanal arama (silinecek)
on:
  push:
    paths: [".github/workflows/gecici_ara.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  ara:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ara
        shell: python
        run: |
          import json, urllib.request, urllib.parse
          cfg = json.load(open("canlitv/diziler.json", encoding="utf-8"))
          fl = json.load(open("canlitv/filmler.json", encoding="utf-8"))
          KEY = cfg["apiKey"]
          def get(p, **q):
              q["key"] = KEY
              try:
                  return json.load(urllib.request.urlopen("https://www.googleapis.com/youtube/v3/" + p + "?" + urllib.parse.urlencode(q), timeout=30))
              except Exception as e:
                  print("ERR", p, q.get("q") or q.get("forHandle") or "", getattr(e, "read", lambda: b"")()[:200]); return {}
          def show(items, tag):
              for c in items or []:
                  s = c.get("statistics", {}); sn = c.get("snippet", {})
                  print(f"{tag}\t{c['id']}\t{sn.get('customUrl','')}\t{sn.get('title','')}\tsubs={s.get('subscriberCount','?')}\tvid={s.get('videoCount','?')}\t{sn.get('country','')}")
          def by_ids(ids, tag):
              for i in range(0, len(ids), 50):
                  show(get("channels", part="snippet,statistics", id=",".join(ids[i:i+50])).get("items"), tag)
          mev = []
          for k in cfg["kanallar"]:
              if k.get("tur") in ("cizgi", "spor"):
                  for y in k.get("youtube", []):
                      if y.startswith("UC"): mev.append(y)
          by_ids(mev, "MEVCUT")
          for h in ["@MashaandtheBearTR","@MashaTurkce","@PeppaPigTurkce","@PeppaPigTürkçe","@PAWPatrolTurkce","@PawPatrolTurkiye","@BlueyTurkce","@SirinlerTurkce","@TheSmurfsTurkce","@KralSakir","@cartoonnetworktr","@RafadanTayfa","@Niloya","@niloyatv","@Pepee","@pepeetv","@SupaStrikasTurkce","@ZigandSharkoTR","@GrizzyandtheLemmingsTR","@LegoTurkiye","@BarbieTurkce","@ThomasandFriendsTurkce","@DisneyJuniorTurkiye","@BenTenTurkce","@MolangTurkce","@Kukuli","@KukuliCizgiFilm","@TRTCocukArsiv","@AkilliTavsanMomoTR","@UgurFilm","@SanerFilm","@KeremFilm","@DuyguFilm","@ErmanFilm","@SuperLig","@trendyolsuperlig","@TFFTV","@ZiraatTurkiyeKupasi","@exxensporofficial","@TBF","@EuroLeague","@UEFA","@bein_sports_turkiye"]:
              show(get("channels", part="snippet,statistics", forHandle=h).get("items"), "HANDLE " + h)
          for q in ["Maşa ile Koca Ayı Türkçe","Peppa Pig Türkçe resmi","Paw Patrol Türkçe","Şirinler Türkçe","Kral Şakir resmi","Niloya resmi","Pepee resmi","Kukuli resmi","Yeşilçam film resmi kanal","Türk filmi tek parça yapım şirketi","Süper Lig maç özetleri","basketbol süper ligi özet"]:
              r = get("search", part="snippet", type="channel", q=q, maxResults=8, regionCode="TR", relevanceLanguage="tr")
              ids = [x["id"]["channelId"] for x in r.get("items", [])]
              if ids: by_ids(ids, "ARA " + q)
