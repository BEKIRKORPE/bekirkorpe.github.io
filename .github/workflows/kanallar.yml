name: Kanal kontrolu (Canli TV)

# 8 saatte bir bütün kanallar denenir. 24 saattir kapalı kanalın resmî sunucusunda yeni adres aranır,
# bulunamazsa "Kapalı kanallar" konusu açılır (GitHub e-posta gönderir).
on:
  schedule:
    - cron: "41 */8 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/kanal_kontrol.py"

permissions:
  contents: write
  issues: write

concurrency:
  group: diziler
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tarayici (kapali kanalin sitesinden adres bulmak icin)
        continue-on-error: true
        run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - name: Butun kanallari dene
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/kanal_kontrol.py
      - name: Degisiklik varsa kaydet
        if: always()
        run: |
          git config user.name "kanal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add canlitv/kanal_durum.json canlitv/kanallar.m3u scripts/kanal_onbellek.json 2>/dev/null; true
          if git diff --cached --quiet; then echo "Degisiklik yok"; exit 0; fi
          git commit -m "Canli TV: kanal kontrolu"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null; sleep $((i*5))
          done
          exit 1
