name: Gecici kanal aramasi
on:
  push:
    paths: [".github/workflows/gecici_arama.yml"]
  workflow_dispatch: {}
jobs:
  ara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ara
        run: |
          cat > /tmp/ara.py <<'PY'
          import json, urllib.request, urllib.parse
          K=json.load(open('canlitv/diziler.json'))['apiKey']
          def api(p, **q):
              q['key']=K
              u='https://www.googleapis.com/youtube/v3/'+p+'?'+urllib.parse.urlencode(q)
              try: return json.load(urllib.request.urlopen(u, timeout=30))
              except Exception as e: print('HATA', p, e); return {}
          ids=['UCQ-aQK4lA3N1qQrwDWRC9qw','UCaXP8Tb2QIjk2q3VHyLjD1Q','UCUd3o920A_ijCRaTRRg8LSg','UCEYRAMSq5PtpDc0mqR_NY9w','UCZUkv6tSC5OfX54gLgjV9aw','UCtInrnU3QbWqFGsdKT1GZtg']
          r=api('channels', part='snippet,statistics,contentDetails,brandingSettings', id=','.join(ids))
          for it in r.get('items',[]):
              sn=it['snippet']; print('#####', it['id'], sn['title'], it['statistics'].get('subscriberCount'), sn.get('publishedAt'))
              print('DESC:', sn.get('description','')[:600].replace(chr(10),' '))
              up=it['contentDetails']['relatedPlaylists']['uploads']
              v=api('playlistItems', part='snippet', playlistId=up, maxResults=12)
              for x in v.get('items',[]): print('   V:', x['snippet']['title'][:110])
              pl=api('playlists', part='snippet,contentDetails', channelId=it['id'], maxResults=10)
              for x in pl.get('items',[]): print('   PL:', x['snippet']['title'][:90], x['contentDetails']['itemCount'])
          PY
          python3 /tmp/ara.py
