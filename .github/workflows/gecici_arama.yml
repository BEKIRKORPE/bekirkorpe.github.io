name: Gecici kanal aramasi
on:
  push:
    paths: [".github/workflows/gecici_arama.yml"]
  workflow_dispatch: {}
jobs:
  ara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ara
        run: |
          cat > /tmp/ara.py <<'PY'
          import json, urllib.request, urllib.parse
          d=json.load(open('canlitv/diziler.json')); K=d['apiKey']
          f=json.load(open('canlitv/filmler.json'))
          def api(p, **q):
              q['key']=K
              u='https://www.googleapis.com/youtube/v3/'+p+'?'+urllib.parse.urlencode(q)
              try: return json.load(urllib.request.urlopen(u, timeout=30))
              except Exception as e: print('HATA', p, e); return {}
          def bilgi(ids):
              out=[]
              for i in range(0,len(ids),50):
                  r=api('channels', part='snippet,statistics', id=','.join(ids[i:i+50]))
                  out+=r.get('items',[])
              return out
          def goster(it, pre=''):
              s=it.get('statistics',{}); sn=it['snippet']
              print(pre, it['id'], '|', sn['title'], '|', sn.get('customUrl',''), '|', s.get('subscriberCount','?'), 'abone |', s.get('videoCount','?'), 'video |', sn.get('country',''), '|', sn.get('description','')[:90].replace(chr(10),' '))
          var=[]
          srcs=[]
          for k in d['kanallar']:
              for y in k.get('youtube',[]) if isinstance(k.get('youtube'),list) else []: srcs.append(y)
          for k in f['kanallar']: srcs.append(k['src'])
          for y in srcs:
              if not isinstance(y,str): continue
              if y.startswith('UC'): var.append(y)
              elif y.startswith('@'):
                  r=api('channels', part='id', forHandle=y)
                  var+= [x['id'] for x in r.get('items',[])]
          print('=== MEVCUT ===')
          for it in bilgi(var): goster(it,'VAR')
          gruplar={
           'CIZGI':["Pokémon Türkiye resmi","Sünger Bob Türkçe resmi","Nickelodeon Türkiye","Ben 10 Türkçe resmi","Thomas ve Arkadaşları Türkçe","Teletubbies Türkçe resmi","Pinkfong Türkçe","Tobot Türkçe resmi","Blippi Türkçe","Moonbug Kids Türkçe","Gecko'nun Garajı Türkçe","Morphle Türkçe","Hello Kitty Türkçe resmi","Alvin ve Sincaplar Türkçe","Lucky Luke Türkçe resmi","Yakari Türkçe","Heidi Türkçe resmi","Ninja Kaplumbağalar Türkçe resmi","Maşa'nın Masalları","Kaptan Pengu TRT"],
           'FILM':["Kemal Film resmi","Ferdi Film resmi","Gold Film resmi","Dumlupınar Film","Atlantik Film resmi","Tunç Film","Uzman Film resmi","Cine Film Yeşilçam"],
           'SPOR':["Türkiye Kupası resmi","Türkiye Hokey Federasyonu","Türkiye Atletizm Federasyonu","Kadın Futbol Süper Ligi","Türkiye Basketbol Ligi TBL","Basketbol Süper Ligi resmi kanal"],
          }
          for g,qs in gruplar.items():
              for q in qs:
                  r=api('search', part='snippet', type='channel', q=q, maxResults=6, regionCode='TR')
                  ids=[x['snippet']['channelId'] for x in r.get('items',[])]
                  print('===',g,'|',q)
                  for it in bilgi(ids): goster(it,'  ' + ('(VAR)' if it['id'] in var else ''))
          PY
          python3 /tmp/ara.py
