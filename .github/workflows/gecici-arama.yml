name: Gecici kanal aramasi
on:
  push:
    paths:
      - ".github/workflows/gecici-arama.yml"
  workflow_dispatch: {}
jobs:
  ara:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ara
        run: |
          cat > /tmp/ara.py <<'PY'
          import json, urllib.request, urllib.parse
          d = json.load(open("canlitv/diziler.json")); K = d["apiKey"]
          f = json.load(open("canlitv/filmler.json"))
          def api(ep, **p):
              p["key"] = K
              u = "https://www.googleapis.com/youtube/v3/" + ep + "?" + urllib.parse.urlencode(p)
              try: return json.load(urllib.request.urlopen(u, timeout=20))
              except Exception as e: print("HATA", ep, e); return {}
          def info(ids):
              out = []
              for i in range(0, len(ids), 50):
                  r = api("channels", part="snippet,statistics", id=",".join(ids[i:i+50]))
                  for it in r.get("items", []):
                      s = it["snippet"]; st = it["statistics"]
                      out.append((int(st.get("subscriberCount", 0)), it["id"], s["title"], s.get("customUrl", ""), s.get("country", ""), st.get("videoCount")))
              return out
          cz = next(k for k in d["kanallar"] if k.get("tur") == "cizgi")
          ex = [x for x in cz["youtube"] if x.startswith("UC")]
          print("=== MEVCUT CIZGI")
          for r in sorted(info(ex), reverse=True): print("MEV", r)
          Q = {"cizgi": ["çizgi film resmi kanal türkçe", "Rafadan Tayfa", "Pepee", "Niloya", "Kukuli", "Peppa Pig Türkçe", "Maşa ile Koca Ayı Türkçe", "Bluey Türkçe", "Paw Patrol Türkçe", "Caillou Türkçe", "Şirinler Türkçe", "Miraculous Türkçe", "Leliko", "Kral Şakir", "Elif ve Arkadaşları", "Pırıl", "Akıllı Tavşan Momo", "Cocomelon Türkçe", "Ninjago Türkçe", "Tom ve Jerry Türkçe"],
               "film": ["yerli film full izle resmi kanal", "türk filmi tek parça resmi", "komedi filmi full hd yerli"],
               "spor": ["Süper Lig maç özetleri resmi", "Trendyol 1. Lig özet", "Basketbol Süper Ligi özet", "Kadın voleybol özet resmi"]}
          for tur, qs in Q.items():
              print("=== ARAMA", tur)
              for q in qs:
                  r = api("search", part="snippet", type="channel", q=q, maxResults=6, regionCode="TR")
                  ids = [it["id"]["channelId"] for it in r.get("items", [])]
                  for x in sorted(info(ids), reverse=True): print(tur, "|", q, "|", x)
          PY
          python3 /tmp/ara.py
