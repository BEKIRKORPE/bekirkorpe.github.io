name: Sarj verisi guncelle

on:
  schedule:
    - cron: "0 3 * * *"   # her gün 06:00 (Türkiye saati)
  workflow_dispatch: {}   # Actions sekmesinden elle çalıştırma

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Veriyi indir ve birlestir
        env:
          OCM_KEY: ${{ secrets.OCM_KEY }}
        run: node scripts/sarj-veri.mjs
      - name: Degisiklik varsa kaydet
        run: |
          git config user.name "sarj-veri-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sarjharitasi/stations.json
          for f in sarjharitasi/konum-onbellek.json sarjharitasi/konum-kalite-onbellek.json sarjharitasi/fiyatlar.json; do [ -f "$f" ] && git add "$f"; done; true
          if git diff --cached --quiet; then echo "Degisiklik yok"; else git commit -m "Sarj verisi guncellendi" && git push; fi
