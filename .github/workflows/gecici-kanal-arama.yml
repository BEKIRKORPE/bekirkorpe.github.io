name: Gecici kanal arama
on:
  push:
    paths: [".github/workflows/gecici-kanal-arama.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  ara:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ara
        run: |
          cat > /tmp/ara.py <<'PY'
          import json, urllib.request, urllib.parse
          d = json.load(open('canlitv/diziler.json')); K = d['apiKey']
          f = json.load(open('canlitv/filmler.json'))
          def get(ep, **p):
              p['key'] = K
              u = 'https://www.googleapis.com/youtube/v3/' + ep + '?' + urllib.parse.urlencode(p)
              try: return json.load(urllib.request.urlopen(u, timeout=20))
              except Exception as e: print('HATA', ep, e); return {}
          def info(ids):
              out = []
              for i in range(0, len(ids), 50):
                  r = get('channels', part='snippet,statistics', id=','.join(ids[i:i+50]))
                  out += r.get('items', [])
              return out
          mevcut = []
          for k in d['kanallar']:
              for y in k['youtube']:
                  if y.startswith('UC'): mevcut.append(y)
          for k in f['kanallar']:
              if k['src'].startswith('UC'): mevcut.append(k['src'])
          print('=== MEVCUT')
          for c in info(mevcut):
              s = c['snippet']; print('M', c['id'], s.get('customUrl'), '|', s['title'], '|', c['statistics'].get('subscriberCount'))
          r = get('channels', part='id,snippet', forUsername='SSport'); print('SSport user ->', [(i['id'], i['snippet']['title']) for i in r.get('items',[])])
          for cid in ['UCwXYPDSqsv61XlpfCpcwWRA','UCTSqeyl0_d8ZbpchNkEGN2Q','UCLw0GF2UMzkrMewFUFFUVow','UCci_1TYZq75xVPNic-zgFBg','UCjNd3bYt27HxyQdtcxgkdqQ','UCrNcqd48r31nZWmh4f27L5Q','UCQ-aQK4lA3N1qQrwDWRC9qw','UCoe0QD045tgbTE6bsbRGU5w']:
              c = get('channels', part='snippet,contentDetails,statistics,brandingSettings', id=cid).get('items',[{}])[0]
              print('###', cid, c.get('snippet',{}).get('title'), c.get('statistics',{}).get('subscriberCount'), 'olusturma', c.get('snippet',{}).get('publishedAt'))
              print('   desc:', c.get('snippet',{}).get('description','')[:400].replace('\n',' '))
              up = c.get('contentDetails',{}).get('relatedPlaylists',{}).get('uploads')
              if up:
                  for it in get('playlistItems', part='snippet', playlistId=up, maxResults=8).get('items',[]):
                      print('   -', it['snippet']['publishedAt'][:10], it['snippet']['title'][:90])
              pl = get('playlists', part='snippet,contentDetails', channelId=cid, maxResults=8).get('items',[])
              for x in pl: print('   PL', x['snippet']['title'][:60], x['contentDetails']['itemCount'])
          PY
          python3 /tmp/ara.py
